# Dependabot — weekly dependency updates for the WebBuilder monorepo.
# Go modules live under server/ (module webbuilder); the frontend and the
# shared workspace packages are npm (pnpm workspace, one lockfile at the
# repo root but per-package manifests). Each directory below is a separate
# update job because Dependabot tracks one manifest per directory.
version: 2
updates:
  # Go dependencies (server/go.mod + server/go.sum).
  - package-ecosystem: "gomod"
    directory: "/server"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Jakarta"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "go"

  # Frontend app (web/package.json).
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Jakarta"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "frontend"

  # Shared React UI package (packages/ui/package.json).
  - package-ecosystem: "npm"
    directory: "/packages/ui"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Jakarta"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "frontend"

  # Shared TypeScript types package (packages/types/package.json).
  - package-ecosystem: "npm"
    directory: "/packages/types"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Jakarta"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "frontend"
