<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Panel admin VibeBuilder" />
    <title>Admin — VibeBuilder</title>
    <script>
      /* Terapkan tema tersimpan sebelum paint (menghindari kedip). Sama dengan
         perilaku shell.html lama (localStorage 'theme', fallback
         'vb-admin-theme', lalu prefers-color-scheme). */
      try {
        var t = localStorage.getItem('theme') || localStorage.getItem('vb-admin-theme')
        if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        if (t === 'dark') document.documentElement.classList.add('dark')
      } catch (e) { /* abaikan */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
