<div class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center gap-3 mb-4">
  <div>
    <h1 class="h3 mb-0">Dashboard</h1>
    <p class="text-muted mb-0" id="dashboard-subtitle">Ringkasan VibeBuilder</p>
  </div>
  <div class="d-flex gap-2 flex-shrink-0">
    <button type="button" class="btn btn-outline-secondary" id="refresh-btn" title="Muat ulang data"><i class="bi bi-arrow-clockwise"></i></button>
  </div>
</div>

<div class="row g-3 g-lg-4 mb-4">
  <div class="col-sm-6 col-xl-3">
    <div class="card stats-card"><div class="card-body"><div class="d-flex align-items-center">
      <div class="flex-shrink-0"><div class="stats-icon bg-primary bg-opacity-10 text-primary"><i class="bi bi-people"></i></div></div>
      <div class="flex-grow-1 ms-3"><p class="h6 mb-0 text-muted">Total Pengguna</p><div class="h3 mb-0" id="stat-users">–</div><small class="text-muted" id="stat-users-sub"></small></div>
    </div></div></div>
  </div>
  <div class="col-sm-6 col-xl-3">
    <div class="card stats-card"><div class="card-body"><div class="d-flex align-items-center">
      <div class="flex-shrink-0"><div class="stats-icon bg-success bg-opacity-10 text-success"><i class="bi bi-box"></i></div></div>
      <div class="flex-grow-1 ms-3"><p class="h6 mb-0 text-muted">Total Proyek</p><div class="h3 mb-0" id="stat-projects">–</div><small class="text-muted" id="stat-projects-sub"></small></div>
    </div></div></div>
  </div>
  <div class="col-sm-6 col-xl-3">
    <div class="card stats-card"><div class="card-body"><div class="d-flex align-items-center">
      <div class="flex-shrink-0"><div class="stats-icon bg-info bg-opacity-10 text-info"><i class="bi bi-chat-dots"></i></div></div>
      <div class="flex-grow-1 ms-3"><p class="h6 mb-0 text-muted">Total Pesan</p><div class="h3 mb-0" id="stat-messages">–</div><small class="text-muted" id="stat-messages-sub"></small></div>
    </div></div></div>
  </div>
  <div class="col-sm-6 col-xl-3">
    <div class="card stats-card"><div class="card-body"><div class="d-flex align-items-center">
      <div class="flex-shrink-0"><div class="stats-icon bg-warning bg-opacity-10 text-warning"><i class="bi bi-cpu"></i></div></div>
      <div class="flex-grow-1 ms-3"><p class="h6 mb-0 text-muted">Token LLM</p><div class="h3 mb-0" id="stat-tokens">–</div><small class="text-muted" id="stat-tokens-sub"></small></div>
    </div></div></div>
  </div>
</div>

<div class="row g-4 mb-4">
  <div class="col-lg-8">
    <div class="card">
      <div class="card-header d-flex justify-content-between align-items-center">
        <h2 class="h5 card-title mb-0">Pesan per Hari (14 hari)</h2>
        <span class="badge bg-light text-dark" id="chart-range-label"></span>
      </div>
      <div class="card-body"><canvas id="messagesChart" style="min-height: 300px;"></canvas></div>
    </div>
  </div>
  <div class="col-lg-4">
    <div class="card card-fill-row">
      <div class="card-header"><h2 class="h5 card-title mb-0">Aktivitas Terbaru</h2></div>
      <div class="card-body"><div class="activity-feed" id="activity-feed"></div></div>
    </div>
  </div>
</div>

<div class="row g-4 mb-4">
  <div class="col-lg-6">
    <div class="card">
      <div class="card-header"><h2 class="h5 card-title mb-0">Status Proyek</h2></div>
      <div class="card-body"><canvas id="statusChart" style="min-height: 260px;"></canvas></div>
    </div>
  </div>
  <div class="col-lg-6">
    <div class="card">
      <div class="card-header"><h2 class="h5 card-title mb-0">Pengguna Teraktif</h2></div>
      <div class="card-body"><div class="table-responsive"><table class="table table-hover mb-0">
        <thead class="table-light"><tr><th>Pengguna</th><th>Proyek</th><th>Pesan</th></tr></thead>
        <tbody id="top-users-body"></tbody>
      </table></div></div>
    </div>
  </div>
</div>
