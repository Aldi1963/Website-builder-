<div class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center gap-3 mb-4">
  <div><h1 class="h3 mb-0">Domain</h1><p class="text-muted mb-0" id="domains-subtitle"></p></div>
</div>
<div class="alert alert-warning mb-4" role="alert">Routing dan SSL otomatis <strong>belum dipasang</strong> — halaman ini hanya mencatat domain dan memeriksa DNS. Target CNAME yang diharapkan: <code>clidi.net</code>.</div>
<div class="card mb-4">
  <div class="card-header"><h2 class="h5 card-title mb-0">Tambah domain</h2></div>
  <div class="card-body">
    <div class="row g-2 align-items-end">
      <div class="col-md-5">
        <label class="form-label" for="domain-project">Proyek</label>
        <select class="form-select" id="domain-project"></select>
      </div>
      <div class="col-md-5">
        <label class="form-label" for="domain-name">Domain</label>
        <input type="text" class="form-control" id="domain-name" placeholder="contoh: toko.example.com" autocomplete="off">
      </div>
      <div class="col-md-2">
        <button type="button" class="btn btn-primary w-100" id="domain-add-btn"><i class="bi bi-plus-lg"></i> Tambah</button>
      </div>
    </div>
  </div>
</div>
<div id="dns-result" class="mb-4"></div>
<div class="card">
  <div class="card-body">
    <div class="table-responsive"><table class="table table-hover mb-0">
      <thead class="table-light"><tr><th>Domain</th><th>Proyek</th><th>Status</th><th>Dibuat</th><th>Diverifikasi</th><th class="text-end">Aksi</th></tr></thead>
      <tbody id="domains-body"></tbody>
    </table></div>
  </div>
</div>
